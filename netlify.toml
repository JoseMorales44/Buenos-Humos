[build]
  command = "pnpm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/cultivation-chat"
  to = "/.netlify/functions/cultivation-chat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
